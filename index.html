
<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Mobile Responsiveness -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Website Information -->
    <title>Tabasamu Furniture Designers | Premium Furniture & Designs</title>

    <meta
      name="description"
      content="Discover premium furniture designs from Tabasamu Furniture Designers. Explore beautiful beds, wardrobes, dining sets and living room furniture. Request your favourite designs directly through WhatsApp."
    />

    <meta
      name="keywords"
      content="Tabasamu Furniture Designers, custom furniture Tanzania, modern furniture, beds, wardrobes, dining tables, furniture designs"
    />

    <meta name="author" content="Tabasamu Furniture Designers" />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#FAF7F0" />

    <!-- Mobile Browser Appearance -->
    <meta name="color-scheme" content="light" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Tabasamu Furniture Designers"
    />

    <meta
      property="og:description"
      content="Beautiful furniture designs, crafted with passion. Explore our collection and request your favourite designs."
    />

    <meta
      property="og:site_name"
      content="Tabasamu Furniture Designers"
    />

    <meta
      property="og:locale"
      content="en_TZ"
    />

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Tabasamu Furniture Designers"
    />

    <meta
      name="twitter:description"
      content="Discover beautiful furniture designs made with care."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/tabasamu-logo.png"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/tabasamu-logo.png"
    />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Mobile App Appearance -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-title"
      content="Tabasamu Furniture"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

  </head>

  <body>

    <!-- Main Application -->
    <div id="app"></div>

    <!-- JavaScript Entry Point -->
    <script type="module" src="/src/main.js"></script>

  </body>
</html>
